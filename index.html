<!DOCTYPE html>
<html lang="en" ng-app="memoryApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Memory Dashboard</title>
    <!-- AngularJS (v1.8.2) CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 24px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #38bdf8; }
        h2 { font-size: 1.2rem; margin-bottom: 16px; color: #94a3b8; }
        .input-group { display: flex; gap: 12px; margin-top: 12px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        button { background: #0284c7; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .status { margin-top: 10px; font-size: 0.9rem; color: #4ade80; }
        .response-box { margin-top: 16px; padding: 16px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; font-size: 1rem; line-height: 1.5; }
    </style>
</head>
<body ng-controller="MemoryController">

    <div class="container">
        <!-- Header -->
        <div>
            <h1>Personal AI Memory Hub (Spring Boot Gateway)</h1>
            <p style="color: #64748b;">Routed through Java Spring Boot & Python FastAPI.</p>
        </div>

        <!-- Add Memory Section -->
        <div class="card">
            <h2>Save New Memory</h2>
            <div class="input-group">
                <input type="text" ng-model="newMemory" placeholder="e.g., MPMC exam topics are..." ng-keyup="$event.keyCode == 13 && addMemory()">
                <button ng-click="addMemory()">Save Memory</button>
            </div>
            <div class="status" ng-if="statusMessage">{{ statusMessage }}</div>
        </div>

        <!-- Search Memory Section -->
        <div class="card">
            <h2>Query Memory Bank</h2>
            <div class="input-group">
                <input type="text" ng-model="searchQuery" placeholder="e.g., What are the MPMC exam topics?" ng-keyup="$event.keyCode == 13 && searchMemory()">
                <button ng-click="searchMemory()">Search</button>
            </div>

            <!-- Loading Indicator -->
            <div class="response-box" ng-if="loading">
                <span style="color: #94a3b8;">Routing through Java gateway to Groq...</span>
            </div>

            <!-- AI Response Output -->
            <div class="response-box" ng-if="aiResponse && !loading">
                <strong style="color: #38bdf8;">AI Assistant:</strong>
                <p style="margin-top: 8px;">{{ aiResponse }}</p>
            </div>
        </div>
    </div>

    <!-- AngularJS Logic -->
    <script>
        var app = angular.module('memoryApp', []);

        app.controller('MemoryController', function($scope, $http) {
            $scope.newMemory = '';
            $scope.searchQuery = '';
            $scope.aiResponse = '';
            $scope.statusMessage = '';
            $scope.loading = false;

            // CHANGED: Points to Spring Boot backend port 8080 instead of Python directly
            var API_BASE = 'http://127.0.0.1:8080/api';

            // Add Memory Function
            $scope.addMemory = function() {
                if (!$scope.newMemory) return;

                $scope.statusMessage = 'Saving...';
                // CHANGED: Calls Java endpoint '/add'
                $http.post(API_BASE + '/add', { text: $scope.newMemory })
                    .then(function(response) {
                        $scope.statusMessage = response.data.message;
                        $scope.newMemory = '';
                    }, function(error) {
                        $scope.statusMessage = 'Error saving memory.';
                    });
            };

            // Search Memory Function
            $scope.searchMemory = function() {
                if (!$scope.searchQuery) return;

                $scope.loading = true;
                $scope.aiResponse = '';

                // CHANGED: Calls Java endpoint '/search'
                $http.post(API_BASE + '/search', { question: $scope.searchQuery })
                    .then(function(response) {
                        $scope.aiResponse = response.data.ai_response;
                        $scope.loading = false;
                    }, function(error) {
                        $scope.aiResponse = 'Error fetching answer from Java gateway.';
                        $scope.loading = false;
                    });
            };
        });
    </script>
</body>
</html>
